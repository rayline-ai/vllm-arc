# The engine's environment, exactly: the vLLM release wheel, the vLLM patches applied to it, the files they
# leave, and every other distribution of the venv. Format and readers: engine/compat.py (the load guard),
# engine/recipe.py, deploy/install.sh, deploy/fetch_patches.py, ci/compose_check.py. One entry per line.
#
# The pins are the qualified engine's venv (one resolution under exclude_newer). Installed and frozen with the
# plugin's line `vllm-arc @ file:///opt/vllm-arc`, this set has freeze sha256
# 52ddda564d8929651501227ed89503b1f6c59395e6fd469bec3f7177ed1a910e, which /health reports. Change a pin only by
# re-qualifying the engine.

