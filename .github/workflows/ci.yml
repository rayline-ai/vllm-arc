name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-guard:
    name: public guard (imports, denylist, SPDX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python ci/public_guard.py .

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      # The gate scans what is being merged: on a pull request the PR's own commits (base..merge), on a push the
      # pushed commit's history. Not every ref: fetch-depth 0 also fetches other branches (spikes, drafts), and a
      # finding there says nothing about this change and would block every PR until that branch is fixed.
      - name: scan history and tree
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..HEAD', github.event.pull_request.base.sha) || github.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 --log-opts="$RANGE" .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --exit-code 1 .

  cpu-tests:
    name: CPU tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    # tests/fixtures/stock_eq_rows.npz holds bfloat16 bits per ATen CPU kernel level; pin a recorded one, so the
    # recorded-row checks run on every x86-64 runner (AVX-512 ones included) rather than skip.
    env:
      ATEN_CPU_CAPABILITY: avx2
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r ci/requirements-test.txt
      # The host CPU, for a recorded-row mismatch: runners on one image differ in CPU vendor and model.
      - run: lscpu | head -20
      - run: python -m pytest -q

  # The plugin composed with the locked engine: vLLM 0.33.0's wheel (by sha256), the fork's patch release (by
  # sha256), the recipe's patch steps, then compat.require(). No GPU, no vLLM import.
  engine-compose:
    name: engine compose (vLLM 0.33.0 + fork patch + plugin)
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: compose
        run: python ci/compose_check.py "$RUNNER_TEMP/compose"
